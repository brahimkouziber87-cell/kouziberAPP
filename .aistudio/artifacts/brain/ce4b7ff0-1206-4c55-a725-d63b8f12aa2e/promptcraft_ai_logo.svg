<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Neon Cyan-Violet Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Vibrant Spark & Accent Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Elegant Canvas Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="400" cy="360" r="240" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.15" />
  <circle cx="400" cy="360" r="180" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2" />

  <!-- The Central Prompt & Creativity Iconography -->
  <g transform="translate(400, 350)" id="logo-symbol">
    <!-- Outer Floating Neon Glow -->
    <path d="M -160, -90 L -60, 0 L -160, 90" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glow)"
          opacity="0.9" />

    <!-- Sharp Modern Prompt Angle (>) symbolizing AI Command Prompting -->
    <path d="M -160, -90 L -60, 0 L -160, 90" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Craft Quill / Neural Cursor Morphing into Creative Spark -->
    <path d="M -20, 65 L 120, -75 L 155, -40 L 15, 100 Z" 
          fill="url(#sparkGrad)" 
          opacity="0.95" />

    <!-- Precision Origami Quill Nib pointing towards the AI Prompt -->
    <path d="M -20, 65 L -45, 90 L 15, 100 Z" 
          fill="#38bdf8" />

    <!-- Creative Spark / Neural Flare emerging from Prompt Engineering -->
    <g transform="translate(175, -95)" filter="url(#glow)">
      <!-- 4-Point Star of Creativity -->
      <path d="M 0,-45 Q 0,0 45,0 Q 0,0 0,45 Q 0,0 -45,0 Q 0,0 0,-45 Z" 
            fill="#ffffff" />
      <circle cx="0" cy="0" r="9" fill="#38bdf8" />
    </g>

    <!-- Secondary Micro Neural Spark -->
    <g transform="translate(110, -135)">
      <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" 
            fill="#a855f7" opacity="0.85" />
    </g>

    <!-- Code Prompt Terminal Cursor / Blinking Craft Bar (_) -->
    <rect x="-35" y="86" width="75" height="14" rx="7" fill="url(#primaryGrad)" opacity="0.8" />
  </g>

  <!-- Elegant Brand Typography -->
  <text x="400" y="615" 
        text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="54" 
        font-weight="800" 
        letter-spacing="2" 
        fill="#f8fafc">
    Prompt<tspan fill="url(#sparkGrad)">Craft</tspan>
  </text>

  <!-- Professional Subtitle / Category Badge -->
  <text x="400" y="665" 
        text-anchor="middle" 
        font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#94a3b8">
    AI STUDIO &bull; INTELLIGENCE
  </text>
</svg>
