<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Royal Moroccan Gold Gradient -->
    <linearGradient id="instGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Deep Moroccan Royal Blue Gradient -->
    <linearGradient id="instBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <linearGradient id="instGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Soft Inner Radial Glow -->
    <radialGradient id="instCenterGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <filter id="instShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" flood-color="#0f172a"/>
    </filter>
  </defs>

  <!-- Outer Circular Shadow & Base -->
  <circle cx="256" cy="256" r="246" fill="#ffffff" filter="url(#instShadow)"/>

  <!-- Outer Royal Blue Border Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#instBlue)" stroke-width="12"/>

  <!-- Decorative Golden Beaded Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#instGold)" stroke-width="4" stroke-dasharray="2,6" stroke-linecap="round"/>

  <!-- Wide Navy Ribbon Ring for Text -->
  <circle cx="256" cy="256" r="208" fill="url(#instBlue)"/>

  <!-- Inner Golden Ring -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#instGold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="156" fill="url(#instCenterGlow)"/>

  <!-- Circular Text Paths -->
  <path id="topTextArc" d="M 64,256 A 192,192 0 1,1 448,256" fill="none"/>
  <path id="bottomTextArc" d="M 448,256 A 192,192 0 0,1 64,256" fill="none"/>

  <!-- Circular Typography: Ministry & Institution in Arabic -->
  <text font-family="'Cairo', 'Amiri', 'Traditional Arabic', serif" font-size="20" font-weight="900" fill="#fef08a" letter-spacing="1.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      المملكة المغربية · وزارة التربية الوطنية والتعليم الأولي والرياضة
    </textPath>
  </text>

  <text font-family="'Cairo', 'Amiri', 'Traditional Arabic', serif" font-size="21" font-weight="900" fill="#ffffff" letter-spacing="2">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      الثانوية التأهيلية · مؤسسة التربية والتعليم العمومي
    </textPath>
  </text>

  <!-- Inner Emblem Graphic -->
  <!-- Classical Architectural Arch (بوابة المعرفة والصرح التربوي) -->
  <path d="M 180,310 L 180,225 C 180,180 214,145 256,145 C 298,145 332,180 332,225 L 332,310 Z" 
        fill="none" stroke="url(#instGold)" stroke-width="5" stroke-linecap="round"/>
  
  <path d="M 194,310 L 194,230 C 194,196 222,160 256,160 C 290,160 318,196 318,230 L 318,310 Z" 
        fill="#eff6ff" opacity="0.6"/>

  <!-- Moroccan Green Pentagram Star at top of arch -->
  <polygon points="256,120 263,138 282,138 267,149 272,167 256,156 240,167 245,149 230,138 249,138" 
           fill="url(#instGreen)" stroke="url(#instGold)" stroke-width="2"/>

  <!-- Radiating Sun of Knowledge Behind Book -->
  <circle cx="256" cy="225" r="28" fill="#fef08a" opacity="0.85"/>
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="185" x2="256" y2="175"/>
    <line x1="285" y1="196" x2="293" y2="188"/>
    <line x1="296" y1="225" x2="306" y2="225"/>
    <line x1="285" y1="254" x2="293" y2="262"/>
    <line x1="227" y1="196" x2="219" y2="188"/>
    <line x1="216" y1="225" x2="206" y2="225"/>
    <line x1="227" y1="254" x2="219" y2="262"/>
  </g>

  <!-- Open Book of Science and Pedagogy (كتاب العلم المفتوح) -->
  <path d="M 256,260 C 235,248 190,250 165,268 L 165,296 C 190,278 235,276 256,288 C 277,276 322,278 347,296 L 347,268 C 322,250 277,248 256,260 Z" 
        fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <path d="M 256,260 L 256,288" stroke="#1e3a8a" stroke-width="3"/>

  <!-- Mathematical & Scientific Symbols on Book Pages -->
  <!-- Left page: Math curves & Infinity -->
  <path d="M 185,268 Q 205,262 230,272" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 188,276 Q 208,270 233,280" stroke="#2563eb" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Right page: Geometry / Science Lines -->
  <path d="M 282,272 Q 307,262 327,268" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 279,280 Q 304,270 324,276" stroke="#2563eb" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Moroccan Olive Wreath / Laurel Leaves (أغصان الزيتون المغربية) -->
  <g fill="url(#instGreen)" stroke="#14532d" stroke-width="1">
    <!-- Left Wreath Leaves -->
    <path d="M 145,230 C 130,225 125,210 135,200 C 145,210 145,225 145,230 Z"/>
    <path d="M 140,260 C 122,258 118,242 128,232 C 138,242 140,255 140,260 Z"/>
    <path d="M 148,290 C 132,292 124,278 132,266 C 142,274 146,286 148,290 Z"/>
    <!-- Right Wreath Leaves -->
    <path d="M 367,230 C 382,225 387,210 377,200 C 367,210 367,225 367,230 Z"/>
    <path d="M 372,260 C 390,258 394,242 384,232 C 374,242 372,255 372,260 Z"/>
    <path d="M 364,290 C 380,292 388,278 380,266 C 370,274 366,286 364,290 Z"/>
  </g>

  <!-- Golden Pedestal Base with Year Ribbon -->
  <path d="M 170,325 L 342,325 L 330,346 L 182,346 Z" fill="url(#instGold)" stroke="#854d0e" stroke-width="2"/>
  <text x="256" y="341" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">
    التميز التربوي · التوجيه والاستحقاق
  </text>

  <!-- Small Stars Decorating the Base -->
  <circle cx="165" cy="256" r="4" fill="#fde047"/>
  <circle cx="347" cy="256" r="4" fill="#fde047"/>
</svg>
